apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-price-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: house-price-api

  template:
    metadata:
      labels:
        app: house-price-api

    spec:
      containers:
      - name: house-price-container
        image: house-price-api
        imagePullPolicy: Never

        ports:
        - containerPort: 8000